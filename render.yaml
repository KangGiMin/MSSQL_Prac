services:
  - type: web
    name: queryground
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: off
    repo: https://github.com/KangGiMin/MSSQL_Prac
    branch: main
    envVars:
      - key: DEPLOYMENT_MODE
        value: hosted
      - key: APP_ACCESS
        value: public
      - key: PUBLIC_CLIENT_ORIGIN
        value: https://kanggimin.github.io
      - key: SQL_PLATFORM
        value: azure
      - key: SQL_AUTH
        value: sql
      - key: SQL_ENCRYPT
        value: "true"
      - key: SQL_TRUST_CERTIFICATE
        value: "false"
      - key: SQL_SERVER
        sync: false
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
